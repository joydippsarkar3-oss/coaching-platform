<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BizBill — Customer Tracking Page (Wireframe)</title>
<!--
  BizBill wireframe: public customer tracking page
  URL pattern: https://track.bizbill.app/t/{token}  (22-char URL-safe token, sole credential)
  PRD refs: Section 5.1 (page spec), Section 3.8 (data projection), Section 2.3 (printing labels), Section 8 (branding footer)
  Mobile-first, single column. Zero login, zero input, zero installation.
  Self-contained: inline CSS/JS, no external resources. Date context: 2026-07-31.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    min-height: 100vh;
    padding-bottom: 120px; /* room for the fixed dev switcher bar */
  }
  main { max-width: 430px; margin: 0 auto; padding: 16px 16px 24px; }

  /* ---------- Shop header ---------- */
  .shop-header {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .shop-logo {
    width: 48px; height: 48px; flex: 0 0 48px;
    border-radius: 10px;
    background: #e2e8f0;
    border: 1px dashed #94a3b8;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #64748b; text-align: center; line-height: 1.2;
  }
  .shop-name { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  .shop-city { font-size: 12px; color: #64748b; margin-top: 2px; }
  .shop-phone {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 6px;
    font-size: 13px; font-weight: 600;
    color: #2563eb; text-decoration: none;
    border: 1px solid #bfdbfe; background: #eff6ff;
    border-radius: 999px; padding: 4px 10px;
  }
  .shop-phone .ico { font-size: 12px; }

  /* ---------- Order No ---------- */
  .orderno-card {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-top: 12px; padding: 16px; text-align: center;
  }
  .orderno-label { font-size: 11px; letter-spacing: 1.5px; color: #64748b; text-transform: uppercase; }
  .orderno {
    font-size: 34px; font-weight: 800; letter-spacing: 2px; margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .customer-ref { margin-top: 6px; font-size: 13px; color: #475569; }
  .customer-ref b { color: #0f172a; }

  /* ---------- Status badge ---------- */
  .status-card {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-top: 12px; padding: 18px 16px; text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 18px; font-weight: 800;
    padding: 10px 22px; border-radius: 999px;
    color: #ffffff;
  }
  .badge .canon { display: block; font-size: 11px; font-weight: 600; opacity: 0.9; margin-top: 2px; letter-spacing: 0.5px; }
  .b-slate  { background: #64748b; }
  .b-blue   { background: #2563eb; }
  .b-amber  { background: #d97706; }
  .b-green  { background: #16a34a; }
  .b-red    { background: #dc2626; }
  .status-note { margin-top: 12px; font-size: 14px; color: #334155; line-height: 1.45; }
  .status-note a { color: #2563eb; font-weight: 700; text-decoration: none; }
  .thankyou { margin-top: 12px; font-size: 15px; font-weight: 700; color: #15803d; }

  /* ---------- Progress bar (4 canonical steps) ---------- */
  .progress-wrap { margin-top: 20px; }
  .progress {
    display: flex; align-items: flex-start; justify-content: space-between;
    position: relative;
  }
  .step { flex: 1; text-align: center; position: relative; z-index: 1; }
  .dot {
    width: 26px; height: 26px; border-radius: 50%;
    margin: 0 auto;
    background: #e2e8f0; border: 2px solid #cbd5e1;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #94a3b8;
  }
  .step .lbl { font-size: 10.5px; font-weight: 700; color: #94a3b8; margin-top: 6px; line-height: 1.25; }
  .step .canon-lbl { font-size: 8.5px; color: #b6c2d1; margin-top: 1px; letter-spacing: 0.4px; }
  .step .bar {
    position: absolute; top: 12px; left: -50%; width: 100%; height: 4px;
    background: #e2e8f0; z-index: -1;
  }
  .step:first-child .bar { display: none; }
  .step.done .dot { background: #16a34a; border-color: #16a34a; color: #ffffff; }
  .step.done .lbl { color: #16a34a; }
  .step.done .bar { background: #16a34a; }
  .step.current .dot {
    background: #2563eb; border-color: #2563eb; color: #ffffff;
    box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.18);
  }
  .step.current .lbl { color: #2563eb; }
  .step.current .bar { background: #16a34a; }
  .progress.cancelled-bar .step .dot { background: #e2e8f0; border-color: #cbd5e1; color: #94a3b8; box-shadow: none; }
  .progress.cancelled-bar .step .lbl,
  .progress.cancelled-bar .step .canon-lbl { color: #cbd5e1; }
  .progress.cancelled-bar .step .bar { background: #e2e8f0; }
  .progress.all-done .step.current .dot { background: #16a34a; border-color: #16a34a; box-shadow: none; }
  .progress.all-done .step.current .lbl { color: #16a34a; }

  /* ---------- Items + money ---------- */
  .money-card {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-top: 12px; padding: 16px;
  }
  .card-title { font-size: 11px; letter-spacing: 1.5px; color: #64748b; text-transform: uppercase; margin-bottom: 10px; }
  .items { list-style: none; }
  .items li {
    font-size: 14px; color: #334155; padding: 6px 0;
    border-bottom: 1px dashed #e2e8f0;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .items li .qty { color: #64748b; font-size: 13px; white-space: nowrap; }
  .money-rows { margin-top: 12px; }
  .mrow {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 0; font-size: 14px; color: #334155;
  }
  .mrow .field-note { display: block; font-size: 9px; color: #94a3b8; font-family: Consolas, Menlo, monospace; }
  .mrow .amt { font-weight: 700; font-variant-numeric: tabular-nums; }
  .mrow.total { border-top: 1px solid #e2e8f0; font-weight: 700; color: #0f172a; }
  .mrow.balance.due {
    background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px;
    padding: 10px 12px; margin-top: 6px; color: #92400e;
  }
  .mrow.balance.due .amt { color: #92400e; font-size: 17px; }
  .mrow.balance.zero {
    background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px;
    padding: 10px 12px; margin-top: 6px; color: #166534;
  }
  .paychip {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1px;
    padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
  }
  .p-partial { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .p-paid    { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .p-unpaid  { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

  /* ---------- Timestamps ---------- */
  .ts-card {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-top: 12px; padding: 14px 16px;
  }
  .ts-row { display: flex; justify-content: space-between; font-size: 13px; color: #475569; padding: 4px 0; }
  .ts-row .v { font-weight: 600; color: #0f172a; }
  .refresh-note { margin-top: 8px; font-size: 11px; color: #94a3b8; text-align: center; }

  /* ---------- Footer branding ---------- */
  footer { text-align: center; margin-top: 20px; }
  .powered {
    display: inline-block; font-size: 12px; color: #64748b;
    border: 1px solid #e2e8f0; background: #ffffff;
    border-radius: 999px; padding: 6px 14px;
  }
  .powered b { color: #0f172a; }
  .plan-note { display: block; margin-top: 6px; font-size: 10px; color: #94a3b8; }

  /* ---------- Not found ---------- */
  .notfound {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;
    margin-top: 40px; padding: 40px 24px; text-align: center;
  }
  .notfound .glyph {
    width: 64px; height: 64px; border-radius: 50%;
    background: #f1f5f9; border: 2px dashed #cbd5e1;
    margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #94a3b8;
  }
  .notfound h1 { font-size: 20px; color: #0f172a; }
  .notfound p { margin-top: 10px; font-size: 14px; color: #64748b; line-height: 1.5; }

  /* ---------- Dev-only state switcher (wireframe control) ---------- */
  #devbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: #fefce8; border-top: 2px dashed #ca8a04;
    padding: 8px 10px 10px;
  }
  #devbar .devlabel {
    font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    color: #854d0e; text-align: center; margin-bottom: 6px;
  }
  #devbar .btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 460px; margin: 0 auto; }
  #devbar button {
    font-family: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid #ca8a04; background: #ffffff; color: #854d0e;
  }
  #devbar button.active { background: #ca8a04; color: #ffffff; }
</style>
</head>
<body>

<main id="page" aria-live="polite">
  <!-- Rendered by JS -->
</main>

<!-- Dev-only state switcher: WIREFRAME PREVIEW CONTROL, NOT PART OF THE PRODUCT.
     The real page renders exactly one state resolved from the token; there is no user input. -->
<div id="devbar" role="group" aria-label="Wireframe preview control">
  <div class="devlabel">Wireframe preview control — not part of the product</div>
  <div class="btns">
    <button data-state="received">Received</button>
    <button data-state="inprogress" class="active">In progress</button>
    <button data-state="ready">Ready</button>
    <button data-state="completed">Completed</button>
    <button data-state="cancelled">Cancelled</button>
    <button data-state="notfound">Not found</button>
  </div>
</div>

<script>
/* =========================================================================
   Wireframe data — sample order matching the PRD Section 3 receipt example.
   In production this arrives as edge-cached status JSON for the URL token;
   the page polls it every 30 s while the tab is visible (FR-5.4).
   ========================================================================= */
var ORDER = {
  shopName: "Sharma Printers",
  shopCity: "12 MG Road, Pune 411001",
  shopPhoneDisplay: "98220 12345",
  shopPhoneTel: "+919822012345",
  orderNo: "PRNT-0231",
  customerMasked: "R****h",          /* first + last character only; phone NEVER shown */
  items: [
    { name: "Visiting Cards", qty: "× 500" },
    { name: "Flex Banner 3×6 ft", qty: "× 1" },
    { name: "Design Charges", qty: "× 1" }
  ],
  createdAt: "31 Jul 2026, 6:42 PM",
  readyBy: "02 Aug 2026, 5:00 PM"    /* promised/expected date, optional */
};

/* Canonical states + printing-niche display labels (PRD Section 2.3) */
var STEPS = [
  { canonical: "CREATED",     label: "Order Received" },
  { canonical: "IN_PROGRESS", label: "Printing" },
  { canonical: "READY",       label: "Ready for Pickup" },
  { canonical: "COMPLETED",   label: "Delivered" }
];

/* Money variants: paise-accurate values rendered as "Rs 1,234.00" */
var MONEY_PARTIAL = { total: "Rs 1,334.00", advance: "Rs 500.00",  balance: "Rs 834.00", balanceDue: true,  pay: "PARTIAL" };
var MONEY_PAID    = { total: "Rs 1,334.00", advance: "Rs 1,334.00", balance: "Rs 0.00",  balanceDue: false, pay: "PAID" };

var STATES = {
  received: {
    step: 0, badgeLabel: "Order Received", badgeCanon: "Created", badgeClass: "b-slate",
    money: MONEY_PARTIAL, lastUpdated: "Just now",
    note: "We have received your order. Track progress here anytime."
  },
  inprogress: {
    step: 1, badgeLabel: "Printing", badgeCanon: "In Progress", badgeClass: "b-blue",
    money: MONEY_PARTIAL, lastUpdated: "4 min ago",
    note: "Your job is being worked on. Check back anytime — this page updates automatically."
  },
  ready: {
    step: 2, badgeLabel: "Ready for Pickup", badgeCanon: "Ready", badgeClass: "b-amber",
    money: MONEY_PARTIAL, lastUpdated: "12 min ago",
    note: "Your order is ready! Please collect it from the shop and pay the balance due."
  },
  completed: {
    step: 3, badgeLabel: "Delivered", badgeCanon: "Completed", badgeClass: "b-green",
    money: MONEY_PAID, lastUpdated: "2 days ago",
    thankyou: "Thank you! Your order has been delivered."
  },
  cancelled: {
    cancelled: true, badgeLabel: "Cancelled", badgeCanon: "Cancelled", badgeClass: "b-red",
    money: MONEY_PARTIAL, lastUpdated: "1 day ago",
    note: 'This order was cancelled. Please contact the shop.'
  },
  notfound: { notfound: true }
};

function payChip(pay) {
  var cls = pay === "PAID" ? "p-paid" : (pay === "PARTIAL" ? "p-partial" : "p-unpaid");
  return '<span class="paychip ' + cls + '">' + pay + "</span>";
}

function renderProgress(state) {
  var wrapClass = "progress";
  if (state.cancelled) wrapClass += " cancelled-bar";
  if (state.step === 3) wrapClass += " all-done";
  var html = '<div class="' + wrapClass + '">';
  for (var i = 0; i < STEPS.length; i++) {
    var cls = "step";
    var mark = i + 1;
    if (!state.cancelled) {
      if (i < state.step) { cls += " done"; mark = "✓"; }
      else if (i === state.step) { cls += " current"; if (state.step === 3) mark = "✓"; }
    }
    html += '<div class="' + cls + '">'
          +   '<div class="bar"></div>'
          +   '<div class="dot">' + mark + "</div>"
          +   '<div class="lbl">' + STEPS[i].label + "</div>"
          +   '<div class="canon-lbl">' + STEPS[i].canonical + "</div>"
          + "</div>";
  }
  html += "</div>";
  return html;
}

function renderMoney(m) {
  var itemsHtml = "";
  for (var i = 0; i < ORDER.items.length; i++) {
    itemsHtml += "<li><span>" + ORDER.items[i].name + '</span><span class="qty">' + ORDER.items[i].qty + "</span></li>";
  }
  var balanceRow;
  if (m.balanceDue) {
    balanceRow = '<div class="mrow balance due">'
               +   '<span>Balance due<span class="field-note">balance_due</span></span>'
               +   '<span class="amt">' + m.balance + "</span>"
               + "</div>";
  } else {
    balanceRow = '<div class="mrow balance zero">'
               +   '<span>Balance due<span class="field-note">balance_due</span></span>'
               +   '<span class="amt">' + m.balance + "</span>"
               + "</div>";
  }
  return '<section class="money-card">'
       +   '<div class="card-title">Order &amp; amounts ' + payChip(m.pay) + "</div>"
       +   '<ul class="items">' + itemsHtml + "</ul>"
       +   '<div class="money-rows">'
       +     '<div class="mrow total"><span>Total<span class="field-note">total_amount</span></span><span class="amt">' + m.total + "</span></div>"
       +     '<div class="mrow"><span>Advance paid<span class="field-note">advance_paid</span></span><span class="amt">' + m.advance + "</span></div>"
       +     balanceRow
       +   "</div>"
       + "</section>";
}

function renderTimestamps(state) {
  return '<section class="ts-card">'
       +   '<div class="ts-row"><span>Created</span><span class="v">' + ORDER.createdAt + "</span></div>"
       +   '<div class="ts-row"><span>Ready by (promised)</span><span class="v">' + ORDER.readyBy + "</span></div>"
       +   '<div class="ts-row"><span>Last updated</span><span class="v">' + state.lastUpdated + "</span></div>"
       +   '<div class="refresh-note">Updates automatically every 30 seconds while this page is open.</div>'
       + "</section>";
}

function renderFooter() {
  return "<footer>"
       +   '<span class="powered">Powered by <b>BizBill</b></span>'
       +   '<span class="plan-note">Shown on Free plan; removed on Pro / Growth (PRD Section 8).</span>'
       + "</footer>";
}

function renderNotFound() {
  /* Generic page: identical for malformed, unknown, and revoked tokens.
     No shop details rendered — no enumeration signal (FR-5.7). */
  return '<div class="notfound">'
       +   '<div class="glyph">?</div>'
       +   "<h1>Order not found</h1>"
       +   "<p>This tracking link is invalid or no longer available.<br>"
       +   "Please check the link printed on your receipt, or contact the shop that gave it to you.</p>"
       + "</div>"
       + renderFooter();
}

function render(stateKey) {
  var state = STATES[stateKey];
  var page = document.getElementById("page");

  if (state.notfound) {
    page.innerHTML = renderNotFound();
    return;
  }

  var noteHtml = "";
  if (state.thankyou) {
    noteHtml = '<div class="thankyou">' + state.thankyou + "</div>";
  } else if (state.cancelled) {
    noteHtml = '<div class="status-note">' + state.note
             + '<br><a href="tel:' + ORDER.shopPhoneTel + '">Call ' + ORDER.shopPhoneDisplay + "</a></div>";
  } else if (state.note) {
    noteHtml = '<div class="status-note">' + state.note + "</div>";
  }

  page.innerHTML =
      '<header class="shop-header">'
    +   '<div class="shop-logo">Shop logo<br>(if uploaded)</div>'
    +   "<div>"
    +     '<div class="shop-name">' + ORDER.shopName + "</div>"
    +     '<div class="shop-city">' + ORDER.shopCity + "</div>"
    +     '<a class="shop-phone" href="tel:' + ORDER.shopPhoneTel + '"><span class="ico">&#9742;</span> ' + ORDER.shopPhoneDisplay + "</a>"
    +   "</div>"
    + "</header>"

    + '<section class="orderno-card">'
    +   '<div class="orderno-label">Order No</div>'
    +   '<div class="orderno">' + ORDER.orderNo + "</div>"
    +   '<div class="customer-ref">For: <b>' + ORDER.customerMasked + "</b></div>"
    + "</section>"

    + '<section class="status-card">'
    +   '<span class="badge ' + state.badgeClass + '">' + state.badgeLabel
    +     '<span class="canon">(' + state.badgeCanon + ")</span>"
    +   "</span>"
    +   noteHtml
    +   '<div class="progress-wrap">' + renderProgress(state) + "</div>"
    + "</section>"

    + renderMoney(state.money)
    + renderTimestamps(state)
    + renderFooter();
}

/* Dev switcher wiring (wireframe only) */
(function () {
  var buttons = document.querySelectorAll("#devbar button");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener("click", function () {
      for (var j = 0; j < buttons.length; j++) buttons[j].classList.remove("active");
      this.classList.add("active");
      render(this.getAttribute("data-state"));
    });
  }
  render("inprogress"); /* default preview state */
})();
</script>
</body>
</html>
