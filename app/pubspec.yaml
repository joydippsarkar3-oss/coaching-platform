name: brand_training_app
description: Franchise computer/vocational training platform — Student & Teacher umbrella app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: 2.5.1
  riverpod_annotation: 2.3.5

  # Navigation
  go_router: 14.2.7

  # Networking
  dio: 5.7.0
  retrofit: 4.4.1

  # Local DB (offline)
  drift: 2.20.2
  sqlite3_flutter_libs: 0.5.24
  path_provider: 2.1.4
  path: 1.9.0

  # Firebase
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3
  firebase_auth: 5.3.1

  # Auth
  local_auth: 2.3.0
  flutter_secure_storage: 9.2.2

  # UI
  cached_network_image: 3.4.1
  shimmer: 3.0.0
  fl_chart: 0.69.0

  # Media
  syncfusion_flutter_pdfviewer: 26.2.14
  video_player: 2.9.2

  # Utilities
  intl: 0.19.0
  permission_handler: 11.3.1
  package_info_plus: 8.1.1
  connectivity_plus: 6.1.0
  share_plus: 10.0.2
  url_launcher: 6.3.1
  image_picker: 1.1.2
  qr_code_scanner: 1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: 2.4.3
  build_runner: 2.4.13
  drift_dev: 2.20.2
  retrofit_generator: 9.1.4
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true

  # Asset and font bundles are declared as the files land. Declaring a directory
  # that does not exist fails `flutter build`, so keep these in step with disk:
  #
  #   assets:
  #     - assets/images/
  #     - assets/icons/
  #
  #   fonts:
  #     - family: NotoSans
  #       fonts:
  #         - asset: assets/fonts/NotoSans-Regular.ttf
  #         - asset: assets/fonts/NotoSans-Bold.ttf
  #           weight: 700
  #
  # NotoSans is referenced by app_theme.dart; until the .ttf files are added
  # Flutter falls back to the platform default rather than erroring.
