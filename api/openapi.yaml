openapi: 3.1.0
info:
  title: BizBill API
  version: 1.0.0
  summary: Billing + QR order-tracking platform for Indian small shops.
  description: |
    The BizBill `/v1` REST API consumed by the Android merchant app (via `/v1/sync` only),
    the Merchant Web Panel, the Super Admin Panel, and the public customer tracking page.

    ## Conventions (normative — see docs/api/README.md for the full text)
    - **JSON over HTTPS**, camelCase property names. SQL snake_case never leaks into payloads.
    - **Money is integer paise** (`totalAmount: 133400` = Rs 1,334.00). Never floats, never strings.
    - **Timestamps** are RFC 3339 / ISO 8601 UTC (`2026-07-31T13:12:42Z`). Client-observed times
      (e.g. `clientUpdatedAt`, `paidAt`) carry the device clock; the server tolerates ±5 min skew.
    - **IDs**: client-creatable entities (orders, orderItems, payments, customers,
      creditLedgerEntries) use client-generated UUIDv7. Server-only entities use server UUIDs.
    - **Order states**: `CREATED, IN_PROGRESS, READY, COMPLETED, CANCELLED` (monotonic forward;
      CANCELLED branches from any non-terminal state). **Payment status**: `UNPAID, PARTIAL, PAID`.
      **Payment methods**: `CASH, UPI, CARD, OTHER`.
    - **Pagination** is opaque-cursor based: pass `cursor` from the previous response's
      `nextCursor`; `nextCursor: null` means end of results.
    - **Errors** always use the shared `ErrorEnvelope` shape with a machine-readable `code`.
    - **Idempotency**: `POST /v1/sync` requires an `Idempotency-Key` header; replays return the
      stored per-op results without re-applying.
    - **Rate limits** are enforced per endpoint class (per JWT, or per IP where unauthenticated).
      Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`;
      429 responses add `Retry-After`.
    - **Auth**: Firebase ID tokens are exchanged once at `POST /v1/auth/exchange` for a backend
      JWT pair (15-min access, 30-day rotating refresh). All non-public endpoints require
      `Authorization: Bearer {accessToken}`. Admin endpoints require an admin-issued JWT
      (`admin_role` claim, TOTP-verified session) and are IP-allowlisted.
    - **Versioning**: breaking changes require `/v2`; additive changes (new optional fields,
      new endpoints, new enum values on *output-only* fields) do not.
  contact:
    name: BizBill Engineering
    url: https://bizbill.app
  license:
    name: Proprietary
    identifier: LicenseRef-BizBill-Proprietary

servers:
  - url: https://api.bizbill.app
    description: Production
  - url: https://api.staging.bizbill.app
    description: Staging (1/10-scale mirror)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Firebase ID token exchange and JWT refresh.
  - name: Tenant
    description: Tenant (shop) profile and business-profile configuration.
  - name: Catalog
    description: Products and pharmacy stock batches (CATALOG / INVENTORY / BATCH_EXPIRY modules).
  - name: Orders
    description: Orders, state transitions and cancellation. Web-panel write surface; the Android app writes exclusively through /v1/sync.
  - name: Payments
    description: Append-only payment records against orders.
  - name: Customers
    description: Per-tenant customers and the CREDIT_LEDGER (khata).
  - name: Sync
    description: Offline-first batched op push and cursor-based delta pull.
  - name: Public
    description: Unauthenticated customer tracking endpoint (CDN-cached).
  - name: Reports
    description: Sales, GST and outstanding-balance reports (served from read replicas).
  - name: Subscription
    description: Plan, checkout, and signed entitlement blob.
  - name: Admin
    description: Super Admin Panel endpoints. Admin JWT + TOTP; IP allowlist; every access audit-logged.

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /v1/auth/exchange:
    post:
      operationId: authExchange
      tags: [Auth]
      summary: Exchange a Firebase ID token for a backend JWT pair
      description: |
        Verifies the Firebase ID token (Phone OTP or Google Sign-In), resolves or creates the
        phone-keyed User, registers the calling device, and issues a backend JWT pair:
        a 15-minute access token and a 30-day rotating refresh token.

        Rate limit: **10/min per IP**. This is the only endpoint that accepts a Firebase token;
        every other authenticated call uses the backend access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthExchangeRequest'
            example:
              firebaseIdToken: eyJhbGciOiJSUzI1NiIsImtpZCI6IjFlOWdkazcifQ.eyJpc3MiOiJo...
              device:
                deviceId: 8f14e45f-ceea-467f-a7e2-8b6f1a2c9d01
                platform: ANDROID
                model: Redmi Note 12
                osVersion: "14"
                appVersion: 1.4.2
                fcmToken: fXk3...:APA91bH...
      responses:
        '200':
          description: Token pair issued. `tenants` lists every tenant the user belongs to; the client selects one and scopes subsequent calls via the access token minted for it.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthExchangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Firebase token invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: FIREBASE_TOKEN_INVALID
                  message: Firebase ID token could not be verified.
                  traceId: 7f2c1b7e9d3a4f01
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Rotate the refresh token and mint a new access token
      description: |
        Accepts a valid refresh token and returns a **new** pair (refresh rotation: the presented
        refresh token is invalidated on use). Reuse of a rotated-out token revokes the whole
        device session (theft detection) and returns 401 `REFRESH_REUSED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
            example:
              refreshToken: rt_v1.5b3fc4a9.eyJzdWIiOiJ1c3JfMDFKMk...
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh token expired, revoked, or reused after rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: REFRESH_REUSED
                  message: Refresh token was already rotated; device session revoked. Re-authenticate.
                  traceId: 3a9d0c11b2e84f77
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ───────────────────────────── Tenant ─────────────────────────────
  /v1/tenant:
    get:
      operationId: getTenant
      tags: [Tenant]
      summary: Get the current tenant (shop) profile
      description: Returns the tenant identified by the JWT `tenant_id` claim. Rate limit 60/min.
      responses:
        '200':
          description: Tenant profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateTenant
      tags: [Tenant]
      summary: Update editable tenant fields
      description: |
        Editable from the panel: shop profile fields (name, address, bill phone, logo),
        `gstin`, `upiVpa`. `shopcode` is immutable after onboarding. GSTIN must match
        `^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$`; an invalid value is rejected with
        `VALIDATION_FAILED` and GST-labelled invoices remain blocked until a valid one is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
            example:
              shopName: Sharma Printers
              gstin: 27ABCDE1234F1Z5
              upiVpa: sharmaprint@okhdfcbank
              billPhone: "+919822012345"
              address:
                lines: ["12 MG Road"]
                city: Pune
                pinCode: "411001"
                state: MH
      responses:
        '200':
          description: Updated tenant profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tenant/business-profile:
    get:
      operationId: getBusinessProfile
      tags: [Tenant]
      summary: Get the tenant's business profile (type, modules, niche config, state labels)
      responses:
        '200':
          description: Business profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateBusinessProfile
      tags: [Tenant]
      summary: Update business type, module toggles, or display state labels
      description: |
        Switching business type applies the new module preset non-destructively (no data is
        deleted). Individual modules may be toggled subject to plan entitlements — enabling a
        plan-gated module without entitlement returns 403 `PLAN_FEATURE_LOCKED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfileUpdate'
            example:
              modules:
                CREDIT_LEDGER: true
                KOT_TOKEN: false
              displayStateLabels:
                IN_PROGRESS: Stitching
      responses:
        '200':
          description: Updated business profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/tenant/shopcode-check:
    post:
      operationId: checkShopcode
      tags: [Tenant]
      summary: Check SHOPCODE availability (onboarding step 1)
      description: |
        Real-time uniqueness check during onboarding. Returns availability plus up to 3
        alternative suggestions on collision. Offline-reserved shopcodes are validated at first
        sync via the same rule set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopcodeCheckRequest'
            example:
              shopcode: PRNT
      responses:
        '200':
          description: Availability result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopcodeCheckResponse'
              examples:
                available:
                  value:
                    shopcode: PRNT
                    available: true
                    suggestions: []
                taken:
                  value:
                    shopcode: PRNT
                    available: false
                    suggestions: [PRNT1, PRNTS, PPRNT]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ───────────────────────────── Catalog ─────────────────────────────
  /v1/products:
    get:
      operationId: listProducts
      tags: [Catalog]
      summary: List products (cursor-paginated)
      description: Rate limit 120/min. Soft-deleted products are excluded unless `includeDeleted=true` (sync/debug use).
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: q
          in: query
          description: Free-text search on name and SKU.
          schema:
            type: string
            maxLength: 120
        - name: trackInventory
          in: query
          description: Filter to inventory-tracked products only.
          schema:
            type: boolean
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Page of products.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  nextCursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when exhausted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createProduct
      tags: [Catalog]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example:
              name: Visiting Cards (500)
              sku: VC-500
              price: 45000
              unit: pack
              hsnSac: "4911"
              gstRate: 18
              trackInventory: false
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Duplicate SKU within the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: DUPLICATE_SKU
                  message: A product with SKU "VC-500" already exists.
                  traceId: 91be44c02a17d3e8
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: getProduct
      tags: [Catalog]
      summary: Get a product
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateProduct
      tags: [Catalog]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
            example:
              price: 47500
              gstRate: 18
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteProduct
      tags: [Catalog]
      summary: Soft-delete a product (tombstone)
      description: Sets `deletedAt`; the row is retained and syncs as a tombstone. Existing order lines keep their frozen snapshot fields.
      responses:
        '204':
          description: Product tombstoned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/products/{productId}/batches:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: listStockBatches
      tags: [Catalog]
      summary: List stock batches for a product (BATCH_EXPIRY module)
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: expiringBefore
          in: query
          description: Only batches expiring on/before this date (near-expiry report feed).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Page of batches.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockBatch'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createStockBatch
      tags: [Catalog]
      summary: Add a stock batch (BATCH_EXPIRY module)
      description: Requires the BATCH_EXPIRY module to be enabled; otherwise 403 `MODULE_DISABLED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockBatchCreate'
            example:
              batchNo: PCM500-B2407
              expiryDate: "2027-06-30"
              qty: 200
              mrp: 3050
      responses:
        '201':
          description: Batch created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ───────────────────────────── Orders ─────────────────────────────
  /v1/orders:
    get:
      operationId: listOrders
      tags: [Orders]
      summary: List orders with filters (cursor-paginated)
      description: |
        Backs the panel "Orders & Invoices" screen. Default sort: `createdAt` descending.
        Rate limit 300/min.
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: state
          in: query
          description: Filter by canonical order state (repeatable).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderState'
          explode: true
        - name: paymentStatus
          in: query
          description: Filter by payment status (repeatable).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentStatus'
          explode: true
        - name: module
          in: query
          description: Order origin module.
          schema:
            type: string
            enum: [CUSTOM_ORDER, QUICK_SALE]
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Created-at lower bound (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Created-at upper bound (exclusive).
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          description: Search Order No, customer name, or customer phone.
          schema:
            type: string
            maxLength: 60
      responses:
        '200':
          description: Page of orders (summary projection).
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createOrder
      tags: [Orders]
      summary: Create an order (web-panel write path)
      description: |
        Phase-2 web write path; the Android app creates orders exclusively through `/v1/sync`
        (FR-7.15). The client supplies the UUIDv7 `id`, the device-allocated `orderNo`, and the
        22-char `trackingToken`; the server validates uniqueness and never rewrites them
        (FR-3.14). Amount fields are verified server-side against the deterministic FR-3.6
        calculation order; a mismatch returns 422 `AMOUNT_MISMATCH`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            example:
              id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8811
              orderNo: PRNT-0231
              trackingToken: 7Kj2mQ9xLp4Wn8Rt3Vb6Yc
              module: CUSTOM_ORDER
              customerId: 018f3b6e-1111-7aaa-9c21-4d5e6f708192
              items:
                - id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8812
                  description: Visiting Cards
                  qty: "500"
                  unitPrice: 90
                  gstRate: 18
                  hsnSac: "4911"
                  lineTotal: 45000
                - id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8813
                  description: Flex Banner 3x6
                  qty: "1"
                  unitPrice: 54000
                  gstRate: 18
                  hsnSac: "4911"
                  lineTotal: 54000
                - id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8814
                  description: Design Charges
                  qty: "1"
                  unitPrice: 20000
                  gstRate: 18
                  hsnSac: "9989"
                  lineTotal: 20000
              billDiscount:
                kind: PERCENT
                value: 500
              subtotal: 119000
              discountTotal: 5950
              taxableValue: 113050
              cgst: 10174
              sgst: 10174
              roundOff: 2
              totalAmount: 133400
              advancePaid: 50000
              advanceMethod: UPI
              promisedReadyAt: "2026-08-02T11:30:00Z"
              customFields:
                paper: Matte 300gsm
                sides: double
              notes: Logo in dark blue; file received on WhatsApp.
              deviceId: 8f14e45f-ceea-467f-a7e2-8b6f1a2c9d01
              clientUpdatedAt: "2026-07-31T13:12:42Z"
      responses:
        '201':
          description: Order created with derived `balanceDue` and `paymentStatus`, plus the advance recorded as the first payment row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8811
                orderNo: PRNT-0231
                trackingToken: 7Kj2mQ9xLp4Wn8Rt3Vb6Yc
                trackingUrl: https://track.bizbill.app/t/7Kj2mQ9xLp4Wn8Rt3Vb6Yc
                module: CUSTOM_ORDER
                state: CREATED
                displayStateLabel: Order Placed
                paymentStatus: PARTIAL
                customerId: 018f3b6e-1111-7aaa-9c21-4d5e6f708192
                items:
                  - id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8812
                    productId: null
                    description: Visiting Cards
                    qty: "500"
                    unitPrice: 90
                    gstRate: 18
                    hsnSac: "4911"
                    lineDiscount: null
                    lineTotal: 45000
                    itemCustomFields: {}
                  - id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8813
                    productId: null
                    description: Flex Banner 3x6
                    qty: "1"
                    unitPrice: 54000
                    gstRate: 18
                    hsnSac: "4911"
                    lineDiscount: null
                    lineTotal: 54000
                    itemCustomFields: {}
                  - id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8814
                    productId: null
                    description: Design Charges
                    qty: "1"
                    unitPrice: 20000
                    gstRate: 18
                    hsnSac: "9989"
                    lineDiscount: null
                    lineTotal: 20000
                    itemCustomFields: {}
                billDiscount:
                  kind: PERCENT
                  value: 500
                subtotal: 119000
                discountTotal: 5950
                taxableValue: 113050
                cgst: 10174
                sgst: 10174
                roundOff: 2
                totalAmount: 133400
                advancePaid: 50000
                balanceDue: 83400
                payments:
                  - id: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8815
