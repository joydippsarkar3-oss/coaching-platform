        '409':
          description: Order is terminal, or a stale `clientUpdatedAt` lost last-write-wins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: STALE_WRITE
                  message: A newer version of this order exists; refetch and reapply.
                  traceId: e00c7d5b12a94f36
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/orders/{orderId}/state:
    parameters:
      - $ref: '#/components/parameters/orderId'
    post:
      operationId: transitionOrderState
      tags: [Orders]
      summary: Advance the order state (monotonic forward)
      description: |
        Server-enforced monotonic forward transitions along
        CREATED → IN_PROGRESS → READY → COMPLETED; forward skips allowed with
        `confirmSkip: true`. CANCELLED is **not** accepted here — use the cancel endpoint.
        A backward move returns 409 `STATE_REGRESSION` with the authoritative current state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStateTransitionRequest'
            example:
              toState: READY
              trigger: SHOP_COPY_SCAN
              occurredAt: "2026-08-01T10:05:00Z"
      responses:
        '200':
          description: Transition applied; returns the updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Backward/invalid transition; body carries the winning server state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: STATE_REGRESSION
                  message: Order is already COMPLETED; backward transitions are not permitted.
                  traceId: 1b6f0a83c92d47e0
                  details:
                    currentState: COMPLETED
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/orderId'
    post:
      operationId: cancelOrder
      tags: [Orders]
      summary: Cancel an order (any non-terminal state)
      description: |
        Branches to CANCELLED from any pre-COMPLETED state. Never triggered by QR scan —
        explicit confirmation only (FR-3.22 exclusion). COMPLETED/CANCELLED orders
        return 409 `ORDER_TERMINAL`. CANCELLED bills still count toward the Free-plan
        monthly bill limit (FR-8.3).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancelRequest'
            example:
              reason: Customer changed mind
              occurredAt: "2026-08-01T09:00:00Z"
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Order already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: ORDER_TERMINAL
                  message: COMPLETED orders cannot be cancelled.
                  traceId: 5d0e93b7a41c268f
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ───────────────────────────── Payments ─────────────────────────────
  /v1/orders/{orderId}/payments:
    parameters:
      - $ref: '#/components/parameters/orderId'
    get:
      operationId: listOrderPayments
      tags: [Payments]
      summary: Payment history for an order (chronological)
      responses:
        '200':
          description: All payment rows, oldest first. Not paginated (bounded per order).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: appendPayment
      tags: [Payments]
      summary: Append a payment record (immutable)
      description: |
        Payments are append-only (FR-3.10): never updated, never deleted. A duplicate client
        `id` is idempotently ignored and returns the stored row with 200. Corrections are new
        **negative-amount** rows with method OTHER and a mandatory `note`. Split collections
        are two calls (e.g. Rs 500 UPI + Rs 232 cash). Recording a payment that zeroes
        `balanceDue` sets `promptComplete: true` in the response so clients can offer the
        one-tap COMPLETED transition (FR-3.9). Overpayment beyond `balanceDue` returns 422
        `OVERPAYMENT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            example:
              id: 018f4a01-2b3c-7def-8a90-112233445566
              amount: 83400
              method: UPI
              paidAt: "2026-08-02T12:01:30Z"
              note: Balance at pickup
      responses:
        '201':
          description: Payment appended; order money fields recomputed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAppendResponse'
              example:
                payment:
                  id: 018f4a01-2b3c-7def-8a90-112233445566
                  orderId: 018f3b6e-7c2a-7d90-b1f4-9a2e0c5d8811
                  amount: 83400
                  method: UPI
                  paidAt: "2026-08-02T12:01:30Z"
                  note: Balance at pickup
                  createdAt: "2026-08-02T12:01:31Z"
                order:
                  totalAmount: 133400
                  advancePaid: 133400
                  balanceDue: 0
                  paymentStatus: PAID
                promptComplete: true
        '200':
          description: Duplicate payment id — previously stored row returned unchanged (idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAppendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ───────────────────────────── Customers & khata ─────────────────────────────
