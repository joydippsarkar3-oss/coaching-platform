    patch:
      operationId: updateOrder
      tags: [Orders]
      summary: Update order content (items, customer link, custom fields, notes)
      description: |
        Last-write-wins by `clientUpdatedAt` (FR-7.11). Does **not** change `state` — use the
        state endpoint. Amount fields are re-verified against FR-3.6. Terminal orders
        (COMPLETED/CANCELLED) reject content edits with 409 `ORDER_TERMINAL`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
